rule-book:
  title: '&bBlock Racing Rules'
  author: '&7BlockRacing'
  pages:
  - '&b&lTask race


    &0Both teams share exclusive tasks. Regular tasks award victory points. Reach half of the initial regular-task total,
    rounded up, to win. Use /menu targets for tasks and personal progress.'
  - '&b&lCurrency and Bonus


    &0Regular tasks also award 1 currency, or 3 in speed mode. Bonus awards its score as currency only. Locate, random teleport
    and supplies spend currency, not victory points. Shared tasks cannot be rolled.'
  - '&b&lSettings and chat


    &0Defaults: 64 regular tasks, at most eight 1-point tasks, plus three Bonus. See config.yml. Use /language for language
    and /shout for global chat during a game.'
