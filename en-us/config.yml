# BlockRacing game settings
# 该配置文件仅用于服务器重启后保留设置数据
# 服务器关闭时将自动保存本局游戏的设置到该文件
# 如果服务器已启动，请前往游戏中的设置界面进行设置，不要在这里调整

# 语言
lang: en_us

# 除去 1 分目标以外的额外进度分值段设置
medium-block: true
hard-block: true

# Total number of target blocks in one game (regular scored tasks)
block-amount: 64

# 每局最多抽取多少个 1 分目标
max-easy-targets-per-game: 8

# Bonus 任务的分数阈值，分数 >= 此值视为 bonus 任务
bonus-score-threshold: 11

# 每局抽取多少个 bonus 任务
bonus-target-amount: 3

# 胜利门槛比例（百分比，默认 50 表示达到常规任务总分的 50% 向上取整即胜利）
# 范围：1 - 100
victory-score-percent: 50

# 任务互斥：true 时某队完成任务后，其他队伍的同一任务直接结算移除；
# false 时各队可分别完成同一任务并各自得分
mutual-exclusion: true

# 同时可做/可见的队首任务数量
# 默认：64
# 最大：128
available-task-amount: 64

# 购买一次 locate 命令权限消耗的可用积分
locate-cost: 5

# 随机传送消耗的可用积分，首次随机传送仍免费
random-teleport-cost: 2

# 游戏模式：
# normal - 普通模式：各队任务列表相同；普通物品任务完成后向对方队伍箱子赠送一组物品
# racing - 竞速模式：各队任务列表相同，不赠送物品
game-mode: racing

# 极速模式：
# 开启极速模式后，开局时将会给予玩家部分道具和效果
# 物品：精准采集铁镐、熟牛排、损坏的鞘翅、经验修补附魔书
# 效果：急迫V
speed-mode: false

# 团队箱子个数
# 默认：8
# 最大：53
max-team-chest-num: 53

# 路径点个数
# 默认：8
# 最大：53
max-team-waypoint-num: 53

# 队伍收藏目标最大显示/收藏数量 (N)
# 默认：5
# 范围：1 - 10
max-favorite-targets: 5

# 如果你不知道这是什么，不要动它
config-version: 26.2.1
