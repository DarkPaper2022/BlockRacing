# BlockRacing game settings
# 该配置文件仅用于服务器重启后保留设置数据
# 服务器关闭时将自动保存本局游戏的设置到该文件
# 如果服务器已启动，请前往游戏中的设置界面进行设置，不要在这里调整

# 语言
lang: zh_cn

# 除去 1 分目标以外的额外进度分值段设置
medium-block: true
hard-block: true

# Total number of target blocks in one game (regular scored tasks)
block-amount: 64

# 每局最多抽取多少个 1 分目标
max-easy-targets-per-game: 8

# Bonus 任务的分数阈值，分数 >= 此值视为 bonus 任务
bonus-score-threshold: 11

# 每局抽取多少个 bonus 任务
bonus-target-amount: 3

# 同时可做/可见的队首任务数量
# 默认：64
# 最大：128
available-task-amount: 64

# 购买一次 locate 命令权限消耗的可用积分
locate-cost: 5

# 随机传送消耗的可用积分，首次随机传送仍免费
random-teleport-cost: 2

# 游戏模式：
# normal - 普通模式：双方共享互斥任务；普通物品任务完成后向对方队伍箱子赠送一组物品
# racing - 竞速模式：双方共享互斥任务，不赠送物品
game-mode: racing

# 极速模式：
# 开启极速模式后，开局时将会给予玩家部分道具和效果
# 物品：精准采集铁镐、熟牛排、损坏的鞘翅、经验修补附魔书
# 效果：急迫V
speed-mode: false

# 团队箱子个数
# 默认：8
# 最大：53
max-team-chest-num: 8

# 路径点个数
# 默认：8
# 最大：53
max-team-waypoint-num: 8

# 如果你不知道这是什么，不要动它
config-version: 26.2.1
