rule-book:
  title: '&b方块竞速规则'
  author: '&7BlockRacing'
  pages:
  - '&b&l任务竞速


    &0双方共享任务，一方完成后另一方无法再获得。普通任务按分值计入胜利进度，达到开局总分的 50%（向上取整）获胜。通过 /menu targets 查看任务和个人进度。'
  - '&b&l积分与 Bonus


    &0普通任务另奖励 1 点可用积分，极速模式为 3 点。Bonus 按其分值奖励可用积分，不计胜利进度。定位、随机传送和补给消耗可用积分，不扣胜利进度。共享任务不允许轮换。'
  - '&b&l配置与交流


    &0默认 64 个普通任务、最多 8 个 1 分任务，另抽 3 个 Bonus。设置见 config.yml。/language 切换语言，游戏中聊天默认队内，/shout 向所有人发言。'
